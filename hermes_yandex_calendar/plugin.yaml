name: yandex_calendar
version: 0.6.2
description: "List, create, update, RSVP to, move, and delete Yandex Calendar events over CalDAV (attendees, busy status, multiple calendars). Requires YANDEX_CALENDAR_LOGIN and YANDEX_CALENDAR_APP_PASSWORD; YANDEX_CALENDAR_ACTIONS restricts which tools are exposed."
author: akinfold
kind: standalone
provides_tools:
  - yandex_calendar_list_calendars
  - yandex_calendar_list_events
  - yandex_calendar_create_event
  - yandex_calendar_update_event
  - yandex_calendar_respond_event
  - yandex_calendar_move_event
  - yandex_calendar_delete_event
# `hermes plugins install` asks for each of these that ~/.hermes/.env lacks.
# Hermes reads `name`, `description`, `url` and `secret`, and drops an entry
# without a `name`.
requires_env:
  - name: YANDEX_CALENDAR_LOGIN
    description: "Yandex login / email (e.g. you@yandex.ru)"
    url: "https://id.yandex.ru/security/app-passwords"
  - name: YANDEX_CALENDAR_APP_PASSWORD
    description: "Yandex app password for CalDAV"
    url: "https://id.yandex.ru/security/app-passwords"
    secret: true
