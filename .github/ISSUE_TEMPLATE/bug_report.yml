name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details below.
        Do **not** paste your Yandex login or app password anywhere in this report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ask the agent to move an event to another calendar, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the plugin with ...
        2. Set plugins.enabled: [yandex_calendar]
        3. Ask the agent to ...
    validations:
      required: true
  - type: textarea
    id: tool-output
    attributes:
      label: Tool output or error
      description: The JSON the tool returned, or the error from the Hermes log. Redact anything private.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "Shown by hermes plugins list"
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent version
      placeholder: "Output of hermes --version"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: input
    id: actions
    attributes:
      label: YANDEX_CALENDAR_ACTIONS
      description: The value you configured, if any (this decides which tools exist).
      placeholder: "read,write"
