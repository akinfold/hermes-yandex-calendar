# Manual live e2e. Credentials come from a GitHub Environment named
# `yandex-calendar-e2e` — define YANDEX_CALENDAR_LOGIN and
# YANDEX_CALENDAR_APP_PASSWORD as secrets there, plus YC_E2E_ATTENDEES
# (comma-separated real mailboxes invited to the throwaway event).
#
# The plugin runs inside a real Hermes, set up the way its installer sets it up
# (see .github/actions/setup-hermes): the latest release by default, or main,
# which is what the installer checks out. `none` runs it on its own, on the
# stand-ins in _compat.py.
name: E2E (live)

on:
  workflow_dispatch:
    inputs:
      hermes:
        description: "Hermes to run the plugin in"
        type: choice
        options: [release, main, none]
        default: release

permissions:
  contents: read

jobs:
  e2e:
    name: Live end-to-end tests
    runs-on: ubuntu-latest
    environment: yandex-calendar-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Hermes the way its installer does
        id: hermes
        if: inputs.hermes != 'none'
        uses: ./.github/actions/setup-hermes
        with:
          channel: ${{ inputs.hermes }}
      - name: Install the plugin into Hermes' virtualenv
        if: inputs.hermes != 'none'
        env:
          HERMES_PYTHON: ${{ steps.hermes.outputs.python }}
        run: |
          set -euo pipefail
          uv pip install --quiet --python "$HERMES_PYTHON" -e . pytest
          # Hermes' own code, or a failed run: never a quiet fallback to the stand-ins.
          "$HERMES_PYTHON" -c "from hermes_yandex_calendar._compat import HERMES_AVAILABLE; assert HERMES_AVAILABLE, 'the plugin cannot import Hermes'"
          echo "E2E_PYTHON=$HERMES_PYTHON" >> "$GITHUB_ENV"
      - name: Install the plugin on its own
        if: inputs.hermes == 'none'
        run: |
          python -m pip install -e '.[dev]'
          echo "E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run live E2E tests
        env:
          YANDEX_CALENDAR_LOGIN: ${{ secrets.YANDEX_CALENDAR_LOGIN }}
          YANDEX_CALENDAR_APP_PASSWORD: ${{ secrets.YANDEX_CALENDAR_APP_PASSWORD }}
          YC_E2E_ATTENDEES: ${{ secrets.YC_E2E_ATTENDEES }}
        run: '"$E2E_PYTHON" -m pytest -m e2e -v'
