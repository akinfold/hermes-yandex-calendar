[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-yandex-calendar"
version = "0.1.0"
description = "Yandex Calendar plugin for Hermes Agent (list/create/delete events over CalDAV)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Roman Akinfeev" }]
keywords = ["hermes", "hermes-agent", "plugin", "yandex", "calendar", "caldav"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "httpx>=0.24",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/akinfold/hermes-yandex-calendar"
Repository = "https://github.com/akinfold/hermes-yandex-calendar"

# Value is the MODULE (Hermes does getattr(module, "register")), not module:register.
[project.entry-points."hermes_agent.plugins"]
yandex_calendar = "hermes_yandex_calendar"

[tool.hatch.build.targets.wheel]
packages = ["hermes_yandex_calendar"]

[tool.hatch.build.targets.wheel.force-include]
"hermes_yandex_calendar/plugin.yaml" = "hermes_yandex_calendar/plugin.yaml"
"hermes_yandex_calendar/py.typed" = "hermes_yandex_calendar/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: live tests that hit the real Yandex CalDAV API (deselected by default)."]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
